[theme]
base = "light"
primaryColor = "#1E40AF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
font = "Pretendard Variable, sans-serif"

[[theme.fontFaces]]
family = "Pretendard Variable"
url = "app/static/fonts/PretendardVariable.woff2"
weight = "100 900"
style = "normal"

[server]
address = "127.0.0.1"
maxUploadSize = 10
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false
