[theme]
base = "light"
primaryColor = "#245B78"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7F9"
textColor = "#202B38"
font = "Pretendard Variable, sans-serif"

[[theme.fontFaces]]
family = "Pretendard Variable"
url = "app/static/fonts/PretendardVariable.woff2"
weight = "100 900"
style = "normal"

[server]
address = "127.0.0.1"
maxUploadSize = 10
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
